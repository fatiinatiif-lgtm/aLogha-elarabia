name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -oq arabic_library.zip

      - name: Add books
        run: |
          mkdir -p arabic_library/assets/books
          if [ -d books ]; then cp -r books/. arabic_library/assets/books/; fi
          for d in nahw sarf balagha arud adab fiqh_lugha; do
            mkdir -p arabic_library/assets/books/$d
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        working-directory: arabic_library
        run: flutter create --platforms=android --org com.arabiclibrary --project-name arabic_library .

      - name: Arabic app name
        working-directory: arabic_library
        run: sed -i 's/android:label="[^"]*"/android:label="المكتبة العربية"/' android/app/src/main/AndroidManifest.xml

      - name: Build
        working-directory: arabic_library
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: arabic-library-apk
          path: arabic_library/build/app/outputs/flutter-apk/app-release.apk
