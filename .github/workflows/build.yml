name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -oq arabic_library.zip

      - name: Add books
        run: |
          shopt -s nullglob
          mkdir -p arabic_library/assets/books
          if [ -d books ]; then cp -r books/. arabic_library/assets/books/; fi
          for d in nahw sarf balagha arud adab fiqh_lugha; do
            mkdir -p arabic_library/assets/books/$d
            # normal zips: nahw-1.zip, adab-2.zip ...
            for z in $d-*.zip; do
              unzip -oq "$z" -d arabic_library/assets/books/$d
            done
            # split zips: adab-big1.zip.001 + adab-big1.zip.002 ...
            for p in $d-big*.zip.001; do
              cat "${p%.001}".* > /tmp/big.zip
              unzip -oq /tmp/big.zip -d arabic_library/assets/books/$d
              rm /tmp/big.zip
            done
          done
          echo "Books per section:"
          for d in nahw sarf balagha arud adab fiqh_lugha; do
            echo "$d: $(find arabic_library/assets/books/$d -type f | wc -l)"
          done

      - name: Merge split book parts into one book
        run: |
          pip install -q pypdf
          # ملفات اتقسمت بالبايت: book.pdf.001 + book.pdf.002 ...
          find arabic_library/assets/books -name '*.pdf.001' | while read -r p; do
            cat "${p%.001}".[0-9][0-9][0-9] > "${p%.001}"
            rm "${p%.001}".[0-9][0-9][0-9]
          done
          # ملفات PDF منفصلة: اسم_part1.pdf, اسم_part2.pdf ... تتدمج في كتاب واحد
          python3 - <<'PY'
          import os, re, sys, unicodedata
          from collections import defaultdict
          from pypdf import PdfWriter, PdfReader

          root = "arabic_library/assets/books"
          # part1 / part-1 / p1 / جزء1 / (1) / _1 / -1  (مع of3 اختياري) في آخر اسم الملف
          PAT = re.compile(
              r"^(?P<base>.+?)[\s_\-\.]*(?:\(?(?:part|pt|p|جزء|الجزء|قسم|الجزء)[\s_\-]*)?\(?(?P<n>\d{1,3})\)?(?:[\s_\-]*(?:of|من)[\s_\-]*\d{1,3})?$",
              re.I)
          EXPLICIT = re.compile(r"(part|pt|_p|جزء|قسم|of|من)", re.I)

          groups = defaultdict(list)
          for d, _, files in os.walk(root):
              for f in files:
                  if not f.lower().endswith(".pdf"):
                      continue
                  stem = unicodedata.normalize("NFC", f[:-4])
                  m = PAT.match(stem)
                  if m:
                      groups[(d, m.group("base").strip(" _-."))].append((int(m.group("n")), f))

          merged = 0
          for (d, base), items in groups.items():
              items.sort()
              nums = [n for n, _ in items]
              # لازم أكتر من ملف، وأرقام متسلسلة تبدأ من 0 أو 1 → دي أجزاء كتاب واحد
              if len(items) < 2 or nums != list(range(nums[0], nums[0] + len(nums))) or nums[0] > 1:
                  continue
              w = PdfWriter()
              for _, f in items:
                  w.append(PdfReader(os.path.join(d, f)))
              out = os.path.join(d, base + ".pdf")
              tmp = out + ".tmp"
              with open(tmp, "wb") as fh:
                  w.write(fh)
              w.close()
              for _, f in items:
                  os.remove(os.path.join(d, f))
              os.rename(tmp, out)
              merged += 1
              print("merged", len(items), "parts ->", base)
          print(merged, "books merged")
          PY

      - name: Shorten book file names
        run: |
          python3 - <<'PY'
          import os, json, hashlib, unicodedata, re
          root = "arabic_library/assets/books"
          titles = {}
          for dirpath, _, files in os.walk(root):
              for f in files:
                  if not f.lower().endswith(".pdf"):
                      continue
                  base = unicodedata.normalize("NFC", f[:-4])
                  new = "b_" + hashlib.sha1(base.encode("utf-8")).hexdigest()[:10] + ".pdf"
                  dst = os.path.join(dirpath, new)
                  os.rename(os.path.join(dirpath, f), dst)
                  title = re.sub(r"\s+", " ", base.replace("_", " ")).strip()
                  titles[dst.replace("\\", "/")[len("arabic_library/"):]] = title
          with open(os.path.join(root, "titles.json"), "w", encoding="utf-8") as fh:
              json.dump(titles, fh, ensure_ascii=False, indent=1)
          print(len(titles), "books renamed")
          PY

      - name: Register book folders in pubspec
        working-directory: arabic_library
        run: |
          python3 - <<'PY'
          import re, os
          p = "pubspec.yaml"
          s = open(p, encoding="utf-8").read()
          dirs = []
          for root, _, files in os.walk("assets/books"):
              if files:
                  dirs.append(root.replace("\\", "/") + "/")
          dirs.sort()
          missing = [d for d in dirs if re.search(r"^\s*-\s*" + re.escape(d) + r"\s*$", s, re.M) is None]
          if missing:
              entries = "".join(f"    - {d}\n" for d in missing)
              if re.search(r"^  assets:\s*$", s, re.M):
                  s = re.sub(r"^(  assets:\s*\n)", lambda m: m.group(1) + entries, s, count=1, flags=re.M)
              elif re.search(r"^flutter:\s*$", s, re.M):
                  s = re.sub(r"^(flutter:\s*\n)", lambda m: m.group(1) + "  assets:\n" + entries, s, count=1, flags=re.M)
              else:
                  s += "\nflutter:\n  assets:\n" + entries
              open(p, "w", encoding="utf-8").write(s)
          print("registered:", missing)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        working-directory: arabic_library
        run: flutter create --platforms=android --org com.arabiclibrary --project-name arabic_library .

      - name: Arabic app name and icon
        working-directory: arabic_library
        run: |
          sed -i 's/android:label="[^"]*"/android:label="المكتبة العربية"/' android/app/src/main/AndroidManifest.xml
          if [ -d android_res ]; then cp -r android_res/. android/app/src/main/res/; fi

      - name: Build
        working-directory: arabic_library
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: arabic-library-apk
          path: arabic_library/build/app/outputs/flutter-apk/app-release.apk
