name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -oq arabic_library.zip

      - name: Add books
        run: |
          mkdir -p arabic_library/assets/books
          for d in nahw sarf balagha arud adab fiqh_lugha; do
            mkdir -p arabic_library/assets/books/$d
          done
          for z in *.zip; do
            b=$(basename "$z" .zip)
            [ "$b" = "arabic_library" ] && continue
            sec=${b%-*}
            unzip -oq "$z" -d arabic_library/assets/books/$sec
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        working-directory: arabic_library
        run: flutter create --platforms=android --org com.arabiclibrary --project-name arabic_library .

      - name: App name and icon
        working-directory: arabic_library
        run: |
          sed -i 's/android:label="[^"]*"/android:label="مكتبة اللغة العربية"/' android/app/src/main/AndroidManifest.xml
          cp -r android_res/. android/app/src/main/res/

      - name: Build
        working-directory: arabic_library
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: arabic-library-apk
          path: arabic_library/build/app/outputs/flutter-apk/app-release.apk
