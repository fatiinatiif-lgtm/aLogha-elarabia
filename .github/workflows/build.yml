name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -oq arabic_library.zip

      - name: Add books
        run: |
          mkdir -p arabic_library/assets/books
          for d in nahw sarf balagha arud adab fiqh_lugha; do
            mkdir -p arabic_library/assets/books/$d
          done
          for z in *.zip; do
            b=$(basename "$z" .zip)
            [ "$b" = "arabic_library" ] && continue
            sec=${b%-*}
            unzip -oq "$z" -d arabic_library/assets/books/$sec
          done
          python3 - <<'PY'
          import os, json
          root = 'arabic_library/assets/books'
          titles = {}
          for sec in sorted(os.listdir(root)):
              d = os.path.join(root, sec)
              if not os.path.isdir(d):
                  continue
              files = sorted(f for f in os.listdir(d) if f.lower().endswith('.pdf'))
              for i, f in enumerate(files, 1):
                  new = f'b{i:03d}.pdf'
                  os.rename(os.path.join(d, f), os.path.join(d, new))
                  titles[f'assets/books/{sec}/{new}'] = f[:-4].replace('_', ' ').strip()
          json.dump(titles, open(os.path.join(root, 'titles.json'), 'w'), ensure_ascii=False)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        working-directory: arabic_library
        run: flutter create --platforms=android --org com.arabiclibrary --project-name arabic_library .

      - name: App name and icon
        working-directory: arabic_library
        run: |
          sed -i 's/android:label="[^"]*"/android:label="مكتبة اللغة العربية"/' android/app/src/main/AndroidManifest.xml
          cp -r android_res/. android/app/src/main/res/

      - name: Build
        working-directory: arabic_library
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: arabic-library-apk
          path: arabic_library/build/app/outputs/flutter-apk/app-release.apk
